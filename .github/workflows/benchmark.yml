name: Benchmark and Publish Report

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r timing-generator/requirements.txt

      - name: Run benchmark script
        working-directory: ${{ github.workspace }}
        run: |
          python timing-generator/benchmark_claims.py

      - name: Upload claim_benchmark_report.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: claim_benchmark_report
          path: timing-generator/output/claim_benchmark_report.json
